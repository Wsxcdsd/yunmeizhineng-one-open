plugins {
    id 'com.android.application'
}

android {
    compileSdk 31
    defaultConfig {
        // ★ 共存版改动 1/2：包名加 .mod 后缀
        //   与官方 App（cc.xypp.yunmeiui）互不干扰，可以同时安装、数据完全独立，
        //   官方 App 不用卸载、登录状态不受影响。
        //   注意：manifest 里的 package 属性保持原值不动（它只决定 R 类与组件解析），
        //   安装包名以这里的 applicationId 为准。
        applicationId "cc.xypp.yunmeiui.mod"
        minSdk 26
        targetSdk 31
        maxSdk 31
        versionCode 14
        versionName "2.3.0-widget"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.5.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    implementation 'androidx.navigation:navigation-fragment:2.5.2'
    implementation 'androidx.navigation:navigation-ui:2.5.2'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    implementation 'com.clj.fastble:FastBleLib:2.3.4'
    implementation 'androidx.security:security-crypto:1.0.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
